openapi: 3.0.3
info:
  title: Love Space App API
  description: |
    Love Space 移动端只读 API。

    ## 鉴权
    所有 `/api/app/**` 接口必须携带 `X-API-Key` 请求头，缺失或不匹配返回 401（`application/problem+json`，RFC 7807）。

    ## 错误响应
    - 401：未鉴权（filter 层），`application/problem+json`
    - 400 / 404 / 500：业务异常，统一为 `{status, error, message, path}` 结构（`application/json`）
  version: 1.0.0
  contact:
    name: Love Space Team

servers:
  - url: https://www.tripleyourlife.com/love-space/app
    description: 生产环境（经 nginx `/love-space/app/` 代理到 8081）
  - url: http://localhost:8081
    description: 本地开发

security:
  - ApiKeyAuth: []

tags:
  - name: City
    description: 城市
  - name: Merchant
    description: 商户
  - name: MerchantReview
    description: 商户评价
  - name: Banner
    description: Banner

paths:
  /api/app/cities:
    get:
      tags: [City]
      summary: 获取上架城市列表
      description: 返回所有 `online=true` 的城市，按 `createdAt` 倒序。
      operationId: listCities
      responses:
        '200':
          description: 城市数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/app/merchants/page:
    get:
      tags: [Merchant]
      summary: 商户分页查询
      description: 排序为 `weight DESC, createdAt DESC`。仅返回 `online=true` 的商户。
      operationId: pageMerchants
      parameters:
        - name: cityId
          in: query
          required: true
          description: 城市 ID（必填）
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          required: false
          description: 推荐生理周期过滤
          schema:
            type: string
            enum:
              - MENSTRUAL
              - FOLLICULAR
              - OVULATION
              - LUTEAL
            x-apifox-enum:
              - { value: MENSTRUAL, name: 月经期, description: '' }
              - { value: FOLLICULAR, name: 卵泡期, description: '' }
              - { value: OVULATION, name: 排卵期, description: '' }
              - { value: LUTEAL, name: 黄体期, description: '' }
        - name: categoryId
          in: query
          required: false
          description: 分类 ID 过滤
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始；非法值回落到 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页大小，仅支持 20 或 30；非法值回落到 20
          schema:
            type: integer
            enum: [20, 30]
            default: 20
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_MerchantListItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/app/merchants/{id}:
    get:
      tags: [Merchant]
      summary: 商户详情
      description: 商户下架或不存在返回 404。
      operationId: getMerchantDetail
      parameters:
        - name: id
          in: path
          required: true
          description: 商户 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 商户详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/app/merchants/{merchantId}/reviews:
    get:
      tags: [MerchantReview]
      summary: 商户评价列表
      description: 按 `sortOrder` 升序。商户下架或不存在返回 404。
      operationId: listMerchantReviews
      parameters:
        - name: merchantId
          in: path
          required: true
          description: 商户 ID
          schema:
            type: string
            format: uuid
        - name: recommended
          in: query
          required: false
          description: 是否仅返回推荐评价；缺省返回全部
          schema:
            type: boolean
      responses:
        '200':
          description: 评价数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/app/banners:
    get:
      tags: [Banner]
      summary: 查询展示用 Banner 列表
      description: |
        默认仅返回 `online=true` 的 banner，按 `updatedAt DESC` 排序。
        关联 city 离线或被删除的条目会被过滤。
      operationId: listBanners
      parameters:
        - name: positionCode
          in: query
          required: true
          description: 展示位置标识码（精确匹配）
          schema:
            type: string
        - name: linkedEntityId
          in: query
          required: false
          description: 关联实体 ID 过滤；缺省时不过滤
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Banner 数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BannerItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 预共享 API Key，由运维通过 `app.security.api-keys` 配置下发

  responses:
    BadRequest:
      description: 请求参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: "Invalid value for parameter 'cityId': not-a-uuid"
            path: /api/app/merchants/page
    Unauthorized:
      description: 未携带或非法 X-API-Key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid or missing API key
            instance: /api/app/cities
    NotFound:
      description: 资源不存在或已下架
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: Merchant not found
            path: /api/app/merchants/0193b8a7-...
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: Internal Server Error
            message: Internal server error
            path: /api/app/cities

  schemas:
    # ---------- 通用 ----------
    ImageResponse:
      type: object
      description: 图片对外表示（含稳定 ID 与一次性签名 URL）
      required: [id, url]
      properties:
        id:
          type: string
          description: 稳定图片标识 = OSS 对象 key（如 `bound/<uuidv7>.<ext>`）
          example: bound/0193b8a7-7c3e-7c5a-9c8e-1234567890ab.jpg
        url:
          type: string
          format: uri
          description: 当次签名的可访问 GET URL（默认 30 分钟有效）
          example: https://love-space-test-0524.oss-cn-hangzhou.aliyuncs.com/bound/xxx.jpg?Signature=...

    ErrorResponse:
      type: object
      description: 业务异常统一响应（GlobalExceptionHandler）
      required: [status, error, message, path]
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: "cityId: 不能为 null"
        path:
          type: string
          example: /api/app/merchants/page

    ProblemDetail:
      type: object
      description: RFC 7807 ProblemDetail（鉴权失败时由 Spring Security 写入）
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    # ---------- 城市 ----------
    CityItemResponse:
      type: object
      required: [id, chineseName, englishName, chineseProvince, englishProvince, backgroundImage]
      properties:
        id:
          type: string
          format: uuid
        chineseName:
          type: string
          example: 杭州
        englishName:
          type: string
          example: Hangzhou
        chineseProvince:
          type: string
          example: 浙江
        englishProvince:
          type: string
          example: Zhejiang
        backgroundImage:
          $ref: '#/components/schemas/ImageResponse'

    # ---------- 商户 ----------
    TagItemResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: 女性友好

    ScoreView:
      type: object
      description: 四维评分百分制（已由原始分换算为 0–100 整数）
      required:
        - safetyEnvironmentPercent
        - businessRightsPercent
        - experienceFriendlyPercent
        - socialContributionPercent
      properties:
        safetyEnvironmentPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 安全环境百分制（原始满分 30）
        businessRightsPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 经营权益百分制（原始满分 25）
        experienceFriendlyPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 体验友好百分制（原始满分 25）
        socialContributionPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 社会贡献百分制（原始满分 20）

    LoveIndexView:
      type: object
      description: 爱女指数
      required: [total, level]
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 100
          description: 四维原始分之和（满分 100）
        level:
          type: integer
          minimum: 1
          maximum: 10
          description: "等级：clamp(ceil(total/10), 1, 10)"

    MerchantListItemResponse:
      type: object
      required: [id, name, logo, address, tags, scores, loveIndex]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          $ref: '#/components/schemas/ImageResponse'
        address:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagItemResponse'
        scores:
          $ref: '#/components/schemas/ScoreView'
        loveIndex:
          $ref: '#/components/schemas/LoveIndexView'

    MerchantDetailResponse:
      type: object
      required: [id, name, logo, images, address, recommendedPeriods, tags, scores, loveIndex]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          $ref: '#/components/schemas/ImageResponse'
        images:
          type: array
          description: 图片列表，按 sortOrder 升序
          items:
            $ref: '#/components/schemas/ImageResponse'
        address:
          type: string
        longitude:
          type: number
          format: double
          nullable: true
          description: 经度，可空
        latitude:
          type: number
          format: double
          nullable: true
          description: 纬度，可空
        recommendedPeriods:
          type: array
          description: 推荐生理周期（按枚举原序）
          items:
            type: string
            enum:
              - MENSTRUAL
              - FOLLICULAR
              - OVULATION
              - LUTEAL
            x-apifox-enum:
              - { value: MENSTRUAL, name: 月经期, description: '' }
              - { value: FOLLICULAR, name: 卵泡期, description: '' }
              - { value: OVULATION, name: 排卵期, description: '' }
              - { value: LUTEAL, name: 黄体期, description: '' }
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagItemResponse'
        scores:
          $ref: '#/components/schemas/ScoreView'
        loveIndex:
          $ref: '#/components/schemas/LoveIndexView'
        story:
          type: string
          nullable: true
          maxLength: 5000
          description: 商户故事，可空

    PageResponse_MerchantListItemResponse:
      type: object
      description: 商户列表分页响应
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MerchantListItemResponse'
        page:
          type: integer
          minimum: 1
          description: 当前页码（1 基）
        size:
          type: integer
          description: 每页大小
          enum: [20, 30]
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 总条数
        totalPages:
          type: integer
          minimum: 0
          description: 总页数

    # ---------- 评价 ----------
    ReviewItemResponse:
      type: object
      required: [nickname, title, content]
      properties:
        nickname:
          type: string
          description: 昵称
        title:
          type: string
          description: 标题
        content:
          type: string
          description: 内容

    # ---------- Banner ----------
    BannerItemResponse:
      type: object
      description: |
        响应字段顺序固定为 `id, name, type, image, data`。
        `data` 形态由 `type` 决定：CITY 时为 `{id, name}`，其它类型由对应业务装配。
      required: [id, name, type, image, data]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          description: Banner 类型（首期仅 CITY）
          enum:
            - CITY
          x-apifox-enum:
            - { value: CITY, name: 城市, description: 'linkedEntityId 指向 loves_city.id；data 返回 {id, name}' }
        image:
          type: array
          items:
            $ref: '#/components/schemas/ImageResponse'
        data:
          type: object
          additionalProperties: true
          description: '类型相关附加数据。CITY 时为 `{ "id": <cityId>, "name": <cityChineseName> }`'
          example:
            id: 0193b8a7-7c3e-7c5a-9c8e-1234567890ab
            name: 杭州
