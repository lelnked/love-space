spring:
  application:
    name: love-space-admin
  profiles:
    active: dev
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/love_space}
    username: ${ADMIN_DB_USERNAME:love_space}
    password: ${ADMIN_DB_PASSWORD:love_space}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

app:
  jwt:
    secret: ${ADMIN_JWT_SECRET:please-replace-with-a-256-bit-base64-secret-please-replace}
    issuer: love-space-admin
    expire-minutes: 720
  storage:
    region: ${ALIYUN_OSS_REGION:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      upload-key-prefix: ${ALIYUN_OSS_UPLOAD_KEY_PREFIX:images}
      bound-key-prefix: ${ALIYUN_OSS_BOUND_KEY_PREFIX:bound}
      url-expiration-seconds: ${ALIYUN_OSS_URL_EXPIRATION_SECONDS:1800}
      max-image-bytes: ${ALIYUN_OSS_MAX_IMAGE_BYTES:20971520}
    sts:
      role-arn: ${ALIYUN_STS_ROLE_ARN:}
      role-session-name: ${ALIYUN_STS_ROLE_SESSION_NAME:love-space-admin}
      duration-seconds: ${ALIYUN_STS_DURATION_SECONDS:900}



logging:
  config: classpath:logback-spring.xml