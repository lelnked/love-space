spring:
  application:
    name: love-space-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/love_space}
    username: ${ADMIN_DB_USERNAME:love_space}
    password: ${ADMIN_DB_PASSWORD:love_space}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

app:
  jwt:
    secret: ${ADMIN_JWT_SECRET:please-replace-with-a-256-bit-base64-secret-please-replace}
    issuer: love-space-admin
    expire-minutes: 720
  storage:
    region: ${ALIYUN_OSS_REGION:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      upload-key-prefix: ${ALIYUN_OSS_UPLOAD_KEY_PREFIX:images}
      bound-key-prefix: ${ALIYUN_OSS_BOUND_KEY_PREFIX:bound}
      url-expiration-seconds: ${ALIYUN_OSS_URL_EXPIRATION_SECONDS:1800}
      max-image-bytes: ${ALIYUN_OSS_MAX_IMAGE_BYTES:20971520}
    sts:
      role-arn: ${ALIYUN_STS_ROLE_ARN:}
      role-session-name: ${ALIYUN_STS_ROLE_SESSION_NAME:love-space-admin}
      duration-seconds: ${ALIYUN_STS_DURATION_SECONDS:900}


love-space:
  # AI 基础库（love-space-ai）配置，环境变量见 openspec/changes/ai-management/proposal.md
  ai:
    api-key: ${ARK_API_KEY:}
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    models: ${AI_MODELS:kimi-k3-1-pro-261024,doubao-seed-2-1-pro-260915,glm-5-3-flash-260828,doubao-seed-2-1-lite-260915,glm-5-2-260617,doubao-seed-evolving,doubao-seed-character-260628,doubao-seed-2-1-turbo-260628,doubao-seed-2-1-pro-260628,doubao-seed-2-0-lite-260428,doubao-seed-2-0-mini-260428}
    temperature: ${AI_TEMPERATURE:}
    top-p: ${AI_TOP_P:}
    max-tokens: ${AI_MAX_TOKENS:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-retries: ${AI_MAX_RETRIES:1}

logging:
  config: classpath:logback-spring.xml