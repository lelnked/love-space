# 初始 admin 用户植入（幂等）
# 明文密码 8@y2eoRLyStM*UVU，cost=10
# 哈希生成命令（离线，密码轮换时按此重算）：
#   htpasswd -bnBC 10 "" '8@y2eoRLyStM*UVU' | tr -d ':\n'
#   或等价的 Spring Security BCryptPasswordEncoder(10).encode("8@y2eoRLyStM*UVU")
# 本 changelog 是默认 admin 的**唯一**植入路径；应用代码不再二次写入。
databaseChangeLog:
  - changeSet:
      id: seed-admin-user-001
      author: love-space
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM "user" WHERE username = 'admin'
      changes:
        - sql:
            sql: |
              INSERT INTO "user" (id, username, password, nickname, role, enable, created_at, updated_at)
              VALUES (
                '019794b6-b400-7000-8000-000000000001'::uuid,
                'admin',
                '$2a$10$/ZJgnCpiw6StS8HFoG/NauuXklHJsYIUfDnWPXATm.F0YwuPZvJM6',
                '管理员',
                'ADMIN',
                true,
                now(),
                now()
              )
