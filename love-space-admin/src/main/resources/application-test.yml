# 测试 / 联调环境：连接 docker 容器 lan_test_postgres（宿主机端口 25432）
server:
  port: 21423

spring:
  datasource:
    url: jdbc:postgresql://localhost:25432/love_space
    username: iris
    password: iris
  jpa:
    properties:
      hibernate:
        format_sql: true
  liquibase:
    contexts: dev

app:
  jwt:
    secret: test-only-jwt-secret-please-change-in-production-32+bytes!!!
  storage:
    oss:
      endpoint: https://oss-test.example.com
      bucket: love-space-test
      region: cn-test
      access-key-id: test-oss-ak
      access-key-secret: test-oss-sk
      upload-key-prefix: images
      bound-key-prefix: bound
      url-expiration-seconds: 1800
      max-image-bytes: 20971520
    sts:
      endpoint: https://sts-test.example.com
      region-id: cn-test
      role-arn: acs:ram::000000000000:role/test-role
      role-session-name: love-space-admin-test
      duration-seconds: 900
      access-key-id: test-sts-ak
      access-key-secret: test-sts-sk
  public-base-url: http://localhost:8080

logging:
  level:
    com.loves.space: DEBUG
