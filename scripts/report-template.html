<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回归测试报告 · {{DATE}}</title>
<style>
/* ============ tokens ============ */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #1b2430;
  --muted: #5d6b7a;
  --border: #e2e7ec;
  --border-strong: #ccd4dc;

  --ok: #16803c;          /* pass 文字（4.5:1 on white） */
  --ok-strong: #0ca30c;   /* meter 填充 */
  --ok-track: #dcf0e2;    /* meter 轨道：同绿系浅一档 */
  --ok-bg: #e9f6ed;
  --ok-border: #c2e4cd;

  --bad: #c23434;         /* fail 文字 */
  --bad-bg: #fdeeee;
  --bad-border: #f0c7c7;

  --p1: #92400e;          /* P1 琥珀（P0 复用红、P2 复用中性灰） */
  --p1-bg: #fdf1e0;
  --p1-border: #f0d9b5;

  --code-bg: #232830;
  --code-fg: #d7dce3;
  --code-muted: #8b94a3;

  --radius: 10px;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 64px; }
code { font-family: var(--mono); font-size: .92em; }

/* ============ header ============ */
.report-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow {
  font: 600 11px/1 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 10px;
}
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 10px; }
.meta { color: var(--muted); font-size: 13px; }
.meta-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  padding: 3px 9px;
  font-size: 12.5px;
  color: var(--muted);
}
.chip code { color: var(--fg); background: none; padding: 0; }
.toolbar { display: flex; gap: 0; margin: 0; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.toolbar button {
  font: 500 13px/1 var(--sans);
  padding: 8px 14px;
  border: 0;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}
.toolbar button + button { border-left: 1px solid var(--border); }
.toolbar button:hover { background: var(--bg); }

/* ============ verdict banner ============ */
.banner {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin: 0 0 16px;
  font-size: 15px;
  border: 1px solid;
}
.banner.good { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
.banner.bad  { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
.banner .verdict { font-size: 18px; font-weight: 650; }
.banner .verdict-sub { color: inherit; opacity: .85; font-size: 13.5px; }
.banner svg { flex: none; }
.banner .rates { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.banner .rate {
  min-width: 76px; text-align: center;
  padding: 6px 12px 7px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .55);
}
.banner .rate.ok { color: var(--ok); } /* 100% 的块恒绿，失败 banner 里也不跟红 */
.banner .rate b { display: block; font-size: 17px; font-weight: 650; line-height: 1.2; }
.banner .rate > span { font-size: 11.5px; opacity: .85; white-space: nowrap; }

/* ============ KPI 统计行 ============ */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px 12px;
}
.stat .label { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.stat .value { font-size: 27px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; }
.stat .value .of { font-size: 15px; font-weight: 500; color: var(--muted); }
.stat .meter { height: 4px; border-radius: 2px; background: var(--ok-track); margin-top: 10px; overflow: hidden; }
.stat .meter i { display: block; height: 100%; background: var(--ok-strong); border-radius: 2px; }
.stat .meter i.bad { background: var(--bad); }

/* ============ sections ============ */
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 6px; flex-wrap: wrap; }
.section-head h2 { font-size: 17px; font-weight: 650; letter-spacing: -.005em; margin: 0; }
.tag {
  font: 600 11px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  padding: 3px 7px;
  background: var(--surface);
}
.section-note { margin: 0 0 14px; }

/* pass / fail 徽章（图标 + 文字，不只靠颜色） */
.pass, .fail {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 600;
  border-radius: 999px;
  padding: 2px 10px;
  border: 1px solid;
  white-space: nowrap;
}
.pass { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.fail { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.pass::before { content: "✓"; font-weight: 700; }
.fail::before { content: "✕"; font-weight: 700; }

/* ============ UT 表格 ============ */
table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: 13.5px;
}
th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
th {
  font: 600 11.5px/1.4 var(--mono);
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  background: #fafbfc;
}
td code { background: none; padding: 0; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============ 域折叠 ============ */
details.domain {
  margin-top: 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
details.domain > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  padding: 13px 18px;
}
details.domain > summary:hover { background: #fafbfc; }
details.domain[open] > summary { border-bottom: 1px solid var(--border); }
details.domain > summary::-webkit-details-marker { display: none; }
details.domain > summary h2 { font-size: 17px; font-weight: 650; margin: 0; text-transform: capitalize; }
.chev {
  flex: none; width: 18px; height: 18px;
  color: var(--muted);
  transition: transform .15s ease;
}
details[open] > summary .chev { transform: rotate(90deg); }

/* ============ 用例分组（IT / WEB / APP 可折叠） ============ */
details.tc-group { margin: 0; }
details.tc-group + details.tc-group { border-top: 1px solid var(--border); }
details.tc-group[open] { background: var(--bg); }
details.tc-group > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  background: #fafbfc;
}
details.tc-group > summary:hover { background: var(--bg); }
details.tc-group > summary::-webkit-details-marker { display: none; }
details.tc-group[open] > summary { border-bottom: 1px solid var(--border); }
details.tc-group .chev { width: 14px; height: 14px; }
details.tc-group > details.case { margin: 8px 14px; }
details.tc-group > details.case:last-of-type { margin-bottom: 14px; }

/* ============ 优先级徽章 + 筛选 ============ */
.prio {
  flex: none;
  font: 700 11px/1 var(--mono);
  letter-spacing: .06em;
  border-radius: 5px;
  padding: 4px 7px;
  border: 1px solid;
}
.prio.p0 { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.prio.p1 { color: var(--p1); background: var(--p1-bg); border-color: var(--p1-border); }
.prio.p2 { color: var(--muted); background: var(--bg); border-color: var(--border-strong); }

.filterbar { display: flex; align-items: center; gap: 12px; margin: 32px 0 12px; flex-wrap: wrap; }
.filterbar + details.domain { margin-top: 0; }
.seg { display: flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button {
  font: 500 13px/1 var(--sans);
  padding: 7px 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { background: var(--bg); }
.seg button.active { background: var(--fg); color: var(--surface); }
.seg button i { width: 8px; height: 8px; border-radius: 50%; }
.seg button[data-prio="p0"] i, .seg button.failbtn i { background: var(--bad); }
.seg button[data-prio="p1"] i { background: var(--p1); }
.seg button[data-prio="p2"] i { background: var(--border-strong); }

/* ============ 用例卡片 ============ */
h3.group {
  font: 600 12px/1 var(--mono);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
details.case {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 8px 0;
}
details.case[open] { border-color: var(--border-strong); }
details.case > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 16px;
}
details.case > summary::-webkit-details-marker { display: none; }
details.case > summary:hover { background: #fafbfc; border-radius: var(--radius); }
details.case[open] > summary { border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
.tc-id {
  flex: none;
  font: 600 12px/1 var(--mono);
  color: var(--muted);
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 5px;
  padding: 4px 8px;
}
.tc-title { flex: 1; font-size: 14px; font-weight: 550; min-width: 200px; }
.case-body { padding: 14px 16px 16px; }

/* 断言清单 */
ul.asserts { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
ul.asserts li { padding: 3px 0 3px 24px; position: relative; }
ul.asserts li::before {
  position: absolute; left: 2px; top: 3px;
  font-weight: 700; font-size: 12px;
}
ul.asserts li.ok::before { content: "✓"; color: var(--ok); }
ul.asserts li.bad::before { content: "✕"; color: var(--bad); }

/* ============ 存证 ============ */
.files { margin-top: 12px; font-size: 13px; color: var(--muted); }
details.file { margin-top: 4px; }
details.file > summary {
  list-style: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--muted);
}
details.file > summary::-webkit-details-marker { display: none; }
details.file > summary code {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 8px;
  color: var(--fg);
}
details.file > summary::after { content: "展开"; font-size: 12px; }
details.file[open] > summary::after { content: "收起"; }
details.file h4 {
  font: 600 11.5px/1 var(--mono);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 14px 0 6px;
}
p.xline { margin: 6px 0 4px; font-size: 12.5px; color: var(--muted); }
p.xline code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }

.codeblock { position: relative; margin: 4px 0 10px; }
.codeblock pre {
  margin: 0;
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 12px 14px;
  border-radius: 8px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
}
.codeblock .copy {
  position: absolute; top: 8px; right: 8px;
  font: 500 11.5px/1 var(--sans);
  padding: 4px 10px;
  border: 1px solid #4a5261;
  border-radius: 6px;
  background: #343b47;
  color: var(--code-fg);
  cursor: pointer;
}
.codeblock .copy:hover { background: #414a58; }

/* ============ 截图 ============ */
.shots { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 2px; }
.shots a {
  width: 190px;
  text-decoration: none;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.shots img {
  width: 100%;
  min-height: 96px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: block;
  background: var(--bg);
  transition: border-color .15s, box-shadow .15s;
}
.shots a:hover img { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(27, 36, 48, .1); }
.shots img.missing {
  height: 110px;
  object-fit: none;
  background:
    linear-gradient(135deg, var(--bg) 25%, transparent 25%, transparent 50%, var(--bg) 50%, var(--bg) 75%, transparent 75%) 0 0 / 14px 14px,
    var(--surface);
}
.shots span { display: block; margin-top: 5px; font-family: var(--mono); font-size: 11px; word-break: break-all; }

/* ============ footer ============ */
.report-foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--border); }

@media (max-width: 760px) {
  .wrap { padding: 24px 14px 48px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .report-head { align-items: flex-start; }
  .tc-title { min-width: 0; }
}
@media print {
  .toolbar { display: none; }
  details { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="report-head">
  <div>
    <p class="eyebrow">Regression Report</p>
    <h1>回归测试报告</h1>
    <div class="meta-chips">
      <span class="chip">回归轮 <code>{{DATE}}</code></span>
      {{COMMIT_CHIP}}
      <span class="chip">存证 <code>test-evidence/regression/</code></span>
    </div>
  </div>
</header>

{{BANNER}}

<div class="stats">
{{STATS}}
</div>

{{UT_SECTION}}

<div class="filterbar">
  <p class="toolbar">
    <button onclick="document.querySelectorAll('details').forEach(d=>d.open=true)">全部展开</button>
    <button onclick="document.querySelectorAll('details').forEach(d=>d.open=false)">全部折叠</button>
  </p>
  <div class="seg">
    <button class="failbtn" onclick="toggleFailFilter(this)"><i></i>仅失败</button>
  </div>
  <div class="seg">
    <button class="active" data-prio="all" onclick="setPrioFilter(this)">全部</button>
    <button data-prio="p0" onclick="setPrioFilter(this)"><i></i>P0</button>
    <button data-prio="p1" onclick="setPrioFilter(this)"><i></i>P1</button>
    <button data-prio="p2" onclick="setPrioFilter(this)"><i></i>P2</button>
  </div>
  <span class="meta" id="filter-count"></span>
</div>

{{DOMAINS}}

<footer class="report-foot">
  <p class="meta">用例定义（living）：<code>tests/&lt;domain&gt;/{it,web,app}.md</code> · 全局矩阵：<code>traceability-matrix.md</code> · 本报告由 <code>scripts/generate-regression-report.js</code> 生成</p>
</footer>

</div>

<script>
// http 非安全上下文没有 navigator.clipboard，降级 execCommand
function copyCode(btn) {
  const text = btn.nextElementSibling.textContent;
  const done = () => { btn.textContent = '已复制'; setTimeout(() => { btn.textContent = '复制'; }, 1500); };
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done); return; }
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove(); done();
}

// 筛选：优先级（all / p0 / p1 / p2）× 仅失败，两者叠加生效
let prioFilter = 'all', failOnly = false;
function applyFilter() {
  let shown = 0, total = 0;
  document.querySelectorAll('details.case').forEach(c => {
    const hit = (prioFilter === 'all' || c.dataset.priority === prioFilter)
      && (!failOnly || c.querySelector(':scope > summary .fail'));
    c.style.display = hit ? '' : 'none';
    total++; if (hit) shown++;
  });
  const filtering = prioFilter !== 'all' || failOnly;
  document.getElementById('filter-count').textContent = filtering ? '显示 ' + shown + ' / ' + total + ' 条' : '';
}
function setPrioFilter(btn) {
  document.querySelectorAll('.seg button[data-prio]').forEach(b => b.classList.toggle('active', b === btn));
  prioFilter = btn.dataset.prio;
  applyFilter();
}
function toggleFailFilter(btn) {
  failOnly = !failOnly;
  btn.classList.toggle('active', failOnly);
  applyFilter();
}
</script>
</body>
</html>
